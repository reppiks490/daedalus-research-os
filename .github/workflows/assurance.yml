name: DAEDALUS research assurance

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/assurance.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/assurance.yml"
  merge_group:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daedalus-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  tests:
    if: github.event_name != 'schedule'
    name: Tests / Python ${{ matrix.python }}
    runs-on: ${{ vars.ASSURANCE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pip check
      - name: Compile source and tests
        run: python -m compileall -q src tests scripts
      - name: Run invariant suite with resource leaks fatal
        run: pytest -W error::ResourceWarning -q

  audit-and-coverage:
    if: github.event_name != 'schedule'
    name: Static audit + coverage floor
    runs-on: ${{ vars.ASSURANCE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and assurance tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-cov
          python -m pip check
      - name: Run DAEDALUS static research audit
        run: python scripts/audit.py
      - name: Enforce non-regression coverage floor
        run: |
          pytest -W error::ResourceWarning \
            --cov=daedalus \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=75 \
            -q
      - name: Smoke CLI contract
        run: daedalus --help
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daedalus-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  package:
    if: github.event_name != 'schedule'
    name: Build + install package artifact
    runs-on: ${{ vars.ASSURANCE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Install built wheel and smoke CLI
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          daedalus --help
      - name: Preserve package evidence
        uses: actions/upload-artifact@v7
        with:
          name: daedalus-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  scheduled-drift:
    if: github.event_name == 'schedule'
    name: Daily deterministic drift check
    runs-on: ${{ vars.ASSURANCE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pip check
      - name: Compile, test, audit, and smoke CLI
        run: |
          python -m compileall -q src tests scripts
          pytest -W error::ResourceWarning -q
          python scripts/audit.py
          daedalus --help

  assurance:
    if: always() && github.event_name != 'schedule'
    name: Assurance gate + evidence
    needs: [tests, audit-and-coverage, package]
    runs-on: ${{ vars.ASSURANCE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Emit machine-readable assurance evidence
        env:
          TESTS: ${{ needs.tests.result }}
          AUDIT: ${{ needs.audit-and-coverage.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          mkdir -p assurance
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          gates = {
              "tests": os.environ["TESTS"],
              "audit_and_coverage": os.environ["AUDIT"],
              "package": os.environ["PACKAGE"],
          }
          doc = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "authority": "research_only",
              "production_authorized": False,
              "execution_allowed": False,
              "gates": gates,
              "result": "success" if all(v == "success" for v in gates.values()) else "failure",
          }
          with open("assurance/assurance-summary.json", "w", encoding="utf-8") as fh:
              json.dump(doc, fh, indent=2, sort_keys=True)
              fh.write("\n")
          print(json.dumps(doc, indent=2, sort_keys=True))
          PY
      - name: Upload assurance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daedalus-assurance-${{ github.run_id }}-${{ github.run_attempt }}
          path: assurance/assurance-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Require all change gates
        env:
          TESTS: ${{ needs.tests.result }}
          AUDIT: ${{ needs.audit-and-coverage.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          printf 'tests=%s\naudit=%s\npackage=%s\n' "$TESTS" "$AUDIT" "$PACKAGE"
          test "$TESTS" = success
          test "$AUDIT" = success
          test "$PACKAGE" = success

  scheduled-assurance:
    if: always() && github.event_name == 'schedule'
    name: Scheduled assurance gate + evidence
    needs: [scheduled-drift]
    runs-on: ${{ vars.ASSURANCE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Emit scheduled assurance evidence
        env:
          DRIFT: ${{ needs.scheduled-drift.result }}
        run: |
          mkdir -p assurance
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          gates = {"scheduled_drift": os.environ["DRIFT"]}
          doc = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "authority": "research_only",
              "production_authorized": False,
              "execution_allowed": False,
              "gates": gates,
              "result": "success" if os.environ["DRIFT"] == "success" else "failure",
          }
          with open("assurance/assurance-summary.json", "w", encoding="utf-8") as fh:
              json.dump(doc, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY
      - name: Upload scheduled assurance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daedalus-scheduled-assurance-${{ github.run_id }}-${{ github.run_attempt }}
          path: assurance/assurance-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Require drift check
        env:
          DRIFT: ${{ needs.scheduled-drift.result }}
        run: test "$DRIFT" = success
